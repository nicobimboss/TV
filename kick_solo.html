<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kick</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0e0f; color: #e8ffe8; font-family: Arial, Helvetica, sans-serif; }
  body { width: 1280px; min-height: 720px; overflow-x: hidden; }
  .oculto { display: none !important; }
  .btn { display: inline-block; padding: 12px 18px; margin: 0 8px 8px 0; background: #1c2320; border-radius: 4px; cursor: pointer; font-size: 19px; }
  .foco { outline: 5px solid #53fc18 !important; outline-offset: -2px; }
  #lista { padding: 22px 34px; }
  #barra h1 { display: inline-block; margin: 0 24px 0 0; font-size: 32px; color: #53fc18; vertical-align: middle; }
  #nuevo { font-size: 19px; padding: 11px; width: 220px; border: 2px solid #2a332e; background: #10140f; color: #fff; vertical-align: middle; }
  #nuevo.foco { border-color: #53fc18 !important; }
  #mensaje { color: #9db09d; margin: 10px 0 14px 0; font-size: 17px; min-height: 20px; }
  .card { display: inline-block; vertical-align: top; width: 384px; margin: 0 18px 20px 0; background: #121613; border-radius: 6px; overflow: hidden; cursor: pointer; border: 3px solid transparent; }
  .card.foco { border-color: #53fc18 !important; }
  .card.off { opacity: 0.5; }
  .mini { width: 384px; height: 216px; background: #1c2320; position: relative; }
  .mini img { width: 384px; height: 216px; display: block; }
  .vivo { position: absolute; left: 8px; top: 8px; background: #eb0400; color: #fff; font-size: 14px; font-weight: bold; padding: 2px 6px; border-radius: 3px; }
  .espect { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,0.7); font-size: 14px; padding: 2px 6px; }
  .offtxt { position: absolute; left: 0; top: 92px; width: 100%; text-align: center; color: #9db09d; font-size: 20px; }
  .info { padding: 10px 12px; height: 70px; overflow: hidden; }
  .nombre { font-weight: bold; font-size: 19px; }
  .titulo { font-size: 15px; color: #d6ffd6; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .juego { font-size: 14px; color: #53fc18; margin-top: 3px; }
  #repro { position: fixed; left: 0; top: 0; width: 1280px; height: 720px; background: #000; }
  #controles { position: absolute; left: 0; right: 0; bottom: 0; padding: 20px 30px; background: rgba(0,0,0,0.78); z-index: 10; }
  #controles .datos { display: inline-block; vertical-align: middle; margin-left: 14px; max-width: 760px; }
  #rNombre { font-size: 22px; font-weight: bold; }
  #rTitulo { font-size: 16px; color: #d6ffd6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #cargando { position: absolute; left: 0; top: 300px; width: 100%; text-align: center; font-size: 28px; z-index: 10; }
  #cargando small { display: block; font-size: 18px; color: #9db09d; margin-top: 10px; }
  #aviso { position: fixed; left: 0; bottom: 0; width: 1280px; background: #3a2a00; color: #ffd34d; padding: 10px; font-size: 15px; text-align: center; }
</style>
</head>
<body>

<div id="lista">
  <div id="barra">
    <h1>Kick</h1>
    <div class="btn" id="bActualizar">Actualizar</div>
    <div class="btn" id="bCalidad">Calidad: <span id="tCalidad">auto</span></div>
    <input id="nuevo" type="text" placeholder="canal de kick">
    <div class="btn" id="bAgregar">Agregar</div>
    <div class="btn" id="bBorrar">Quitar</div>
  </div>
  <div id="mensaje"></div>
  <div id="canales"></div>
  <div id="aviso" class="oculto"></div>
</div>

<div id="repro" class="oculto">
  <div id="cargando">Cargando...<small id="cargaDet"></small></div>
  <div id="controles">
    <div class="btn" id="bVolver">&larr; Canales</div>
    <div class="btn" id="bCalidad2">Calidad: <span id="tCalidad2">auto</span></div>
    <div class="datos"><div id="rNombre"></div><div id="rTitulo"></div></div>
  </div>
</div>

<script>
// ES5, autónoma: habla DIRECTO con Kick (sin servidor), guarda favoritos en el
// propio TV (localStorage) y reproduce con el player nativo. Pensada para correr
// como app del menú (contexto tv_store) y poder vivir dentro del TV (file://).
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var CALIDADES = ['auto', '1080', '720', '480', '360', '160'];
  var calidad = 'auto', modoBorrar = false, canales = [], actual = null;
  var player = null, poll = null, refresco = null;
  var COLS = 3, focos = [], fi = 0;

  function ls(k, v) {
    try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; }
  }
  calidad = ls('kick_calidad') || 'auto';

  function favs() {
    try { var a = JSON.parse(ls('kick_favs') || '[]'); if (a && a.length) return a; } catch (e) {}
    return ['davooxeneize'];
  }
  function setFavs(a) { ls('kick_favs', JSON.stringify(a)); }

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

  var nativo = !!(window.oipfObjectFactory && oipfObjectFactory.createVideoMpegObject);
  if (!nativo) { $('aviso').className = ''; $('aviso').innerHTML = 'Abrí esta app desde el menú del TV para que funcione el reproductor.'; }

  function api(slug, cb) {
    var x = new XMLHttpRequest();
    x.open('GET', 'https://kick.com/api/v2/channels/' + slug, true);
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      var d = null; try { d = JSON.parse(x.responseText); } catch (e) {}
      cb(x.status === 200 ? d : null);
    };
    x.onerror = function () { cb(null); };
    try { x.send(); } catch (e) { cb(null); }
  }

  function datos(slug, d) {
    var o = { slug: slug, nombre: slug, vivo: false, existe: !!d, titulo: '', juego: '', espect: 0, mini: null, playback: null };
    if (!d) return o;
    var u = d.user || {};
    o.nombre = u.username || slug;
    o.playback = d.playback_url;
    var l = d.livestream;
    if (l) {
      o.vivo = true; o.titulo = l.session_title || ''; o.espect = l.viewer_count || 0;
      var cats = l.categories || []; o.juego = (cats[0] && cats[0].name) || '';
      var th = l.thumbnail || {}; o.mini = th.url || th.src;
    }
    return o;
  }

  function cargarLista() {
    var lista = favs();
    canales = [];
    for (var i = 0; i < lista.length; i++) canales.push({ slug: lista[i], nombre: lista[i], vivo: false, existe: true, cargando: true });
    $('mensaje').innerHTML = 'Actualizando...';
    dibujar();
    var pendientes = lista.length;
    for (var j = 0; j < lista.length; j++) {
      (function (slug, idx) {
        api(slug, function (d) {
          canales[idx] = datos(slug, d);
          pendientes--;
          dibujar();
          if (pendientes <= 0) {
            canales.sort(function (a, b) { return (a.vivo === b.vivo) ? (b.espect - a.espect) : (a.vivo ? -1 : 1); });
            dibujar();
            var n = 0; for (var k = 0; k < canales.length; k++) if (canales[k].vivo) n++;
            $('mensaje').innerHTML = modoBorrar ? 'Elegí un canal para quitarlo. "Listo" para terminar.'
              : n + ' de ' + canales.length + ' en vivo · ' + new Date().toLocaleTimeString();
          }
        });
      })(lista[j], j);
    }
  }

  function dibujar() {
    var cont = $('canales'); cont.innerHTML = '';
    for (var i = 0; i < canales.length; i++) {
      var c = canales[i], d = document.createElement('div');
      d.className = 'card' + (c.vivo || modoBorrar ? '' : ' off') + (modoBorrar ? ' borrar' : '');
      var mini = c.cargando ? '<div class="offtxt">...</div>'
        : (c.vivo && c.mini ? '<img src="' + esc(c.mini) + '"><span class="vivo">EN VIVO</span><span class="espect">' + c.espect + '</span>'
          : '<div class="offtxt">' + (c.existe ? 'Desconectado' : 'No encontrado') + '</div>');
      d.innerHTML = '<div class="mini">' + mini + '</div><div class="info"><div class="nombre">' + esc(c.nombre) +
        '</div><div class="titulo">' + esc(c.titulo || '') + '</div><div class="juego">' + esc(c.juego || '') + '</div></div>';
      d.onclick = (function (canal) { return function () { tocar(canal); }; })(c);
      cont.appendChild(d);
    }
    refrescarFocos();
  }

  function tocar(c) {
    if (modoBorrar) { setFavs(favs().filter(function (s) { return s !== c.slug; })); cargarLista(); }
    else if (c.vivo) { ver(c); }
  }

  $('bActualizar').onclick = cargarLista;
  $('bCalidad').onclick = function () { rotar(); };
  $('bCalidad2').onclick = function () { rotar(); };
  $('bBorrar').onclick = function () { modoBorrar = !modoBorrar; $('bBorrar').innerHTML = modoBorrar ? 'Listo' : 'Quitar'; cargarLista(); };
  $('bAgregar').onclick = function () {
    var t = $('nuevo').value.replace(/^\s+|\s+$/g, '').toLowerCase();
    var m = t.match(/kick\.com\/([a-z0-9_]+)/); if (m) t = m[1];
    if (!/^[a-z0-9_]{2,30}$/.test(t)) { $('mensaje').innerHTML = 'Nombre inválido.'; return; }
    var f = favs(); if (f.indexOf(t) < 0) f.push(t); setFavs(f); $('nuevo').value = ''; cargarLista();
  };

  function mostrarCal() { $('tCalidad').innerHTML = calidad; $('tCalidad2').innerHTML = calidad; }
  function rotar() {
    var i = 0; for (var j = 0; j < CALIDADES.length; j++) if (CALIDADES[j] === calidad) i = j;
    calidad = CALIDADES[(i + 1) % CALIDADES.length]; ls('kick_calidad', calidad); mostrarCal();
    if (actual) reproducir();
  }

  // elegir variante parseando el playlist maestro (si CORS lo permite; si no, auto)
  function elegirUrl(master, cb) {
    if (calidad === 'auto') { cb(master); return; }
    var x = new XMLHttpRequest();
    x.open('GET', master, true);
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status !== 200) { cb(master); return; }
      var lineas = x.responseText.split('\n'), obj = parseInt(calidad, 10), mejor = null, mejorH = -1, mejorLE = null, mejorLEH = -1;
      for (var i = 0; i < lineas.length; i++) {
        if (lineas[i].indexOf('#EXT-X-STREAM-INF') === 0) {
          var mr = lineas[i].match(/RESOLUTION=\d+x(\d+)/);
          var h = mr ? parseInt(mr[1], 10) : 0;
          var url = (lineas[i + 1] || '').replace(/^\s+|\s+$/g, '');
          if (url && url.charAt(0) !== '#') {
            if (h === obj) { mejor = url; mejorH = h; }
            if (h <= obj && h > mejorLEH) { mejorLE = url; mejorLEH = h; }
          }
        }
      }
      cb(mejor || mejorLE || master);
    };
    x.onerror = function () { cb(master); };
    try { x.send(); } catch (e) { cb(master); }
  }

  function matar() {
    clearInterval(poll);
    if (player) {
      try { if (player.stop) player.stop(); else { player.pause(); player.src = ''; } } catch (e) {}
      try { player.parentNode.removeChild(player); } catch (e) {}
      player = null;
    }
  }

  function ver(c) {
    actual = c; clearInterval(refresco);
    $('lista').className = 'oculto'; $('repro').className = '';
    $('rNombre').innerHTML = esc(c.nombre) + (c.juego ? ' · <span style="color:#53fc18">' + esc(c.juego) + '</span>' : '');
    $('rTitulo').innerHTML = esc(c.titulo);
    fi = 0; refrescarFocos(); reproducir();
  }

  function reproducir() {
    matar();
    $('cargando').className = ''; $('cargaDet').innerHTML = 'Pidiendo stream (' + calidad + ')...';
    api(actual.slug, function (d) {
      if (!actual) return;
      var o = datos(actual.slug, d);
      if (!o.playback) { $('cargaDet').innerHTML = 'El canal no está en vivo.'; return; }
      elegirUrl(o.playback, function (url) {
        if (!actual) return;
        $('cargaDet').innerHTML = 'Cargando video...';
        try {
          if (nativo) {
            // Reproductor NATIVO (contexto de app privilegiado)
            player = oipfObjectFactory.createVideoMpegObject();
            player.style.cssText = 'position:absolute;left:0;top:0;width:1280px;height:720px;z-index:1';
            $('repro').appendChild(player);
            player.data = url; player.play(1);
            var ultima = -1;
            poll = setInterval(function () {
              if (!player) return;
              if (player.playState === 1 && player.playPosition !== ultima) $('cargando').className = 'oculto';
              else if (player.playState === 6) { $('cargando').className = ''; $('cargaDet').innerHTML = 'Error de reproducción (' + player.error + ').'; }
              ultima = player.playPosition;
            }, 1000);
          } else {
            // Respaldo: <video> común (reproduce HLS-TS en el navegador del TV)
            player = document.createElement('video');
            player.setAttribute('autoplay', 'autoplay');
            player.style.cssText = 'position:absolute;left:0;top:0;width:1280px;height:720px;z-index:1;background:#000';
            $('repro').appendChild(player);
            player.src = url;
            try { player.play(); } catch (e) {}
            var prev = -1;
            poll = setInterval(function () {
              if (!player) return;
              if (!player.paused && player.currentTime !== prev) $('cargando').className = 'oculto';
              if (player.error) { $('cargando').className = ''; $('cargaDet').innerHTML = 'Error de video (' + player.error.code + ').'; }
              prev = player.currentTime;
            }, 1000);
          }
        } catch (e) { $('cargaDet').innerHTML = 'No se pudo crear el reproductor: ' + esc(e); }
      });
    });
  }

  $('bVolver').onclick = function () {
    actual = null; matar(); $('repro').className = 'oculto'; $('lista').className = '';
    fi = 0; cargarLista(); refresco = setInterval(cargarLista, 60000);
  };

  // ---------- Navegación con control remoto ----------
  function enRepro() { return $('repro').className.indexOf('oculto') < 0; }
  function refrescarFocos() {
    if (enRepro()) focos = [$('bVolver'), $('bCalidad2')];
    else {
      focos = [$('bActualizar'), $('bCalidad'), $('nuevo'), $('bAgregar'), $('bBorrar')];
      var cards = $('canales').getElementsByTagName('div');
      for (var i = 0; i < cards.length; i++) if (cards[i].className.indexOf('card') === 0) focos.push(cards[i]);
    }
    if (fi >= focos.length) fi = focos.length - 1; if (fi < 0) fi = 0;
    pintar();
  }
  function pintar() {
    for (var i = 0; i < focos.length; i++) {
      var cl = focos[i].className.replace(/\s*foco/g, '');
      focos[i].className = (i === fi) ? cl + ' foco' : cl;
    }
    if (focos[fi] && focos[fi].scrollIntoView) { try { focos[fi].scrollIntoView(false); } catch (e) {} }
  }
  function primeraCard() { for (var i = 0; i < focos.length; i++) if (focos[i].className.indexOf('card') === 0) return i; return -1; }
  function mover(dx, dy) {
    if (!focos.length) return;
    var pc = primeraCard(), enCards = pc >= 0 && fi >= pc;
    if (dy !== 0 && enCards) {
      var dest = fi + dy * COLS;
      if (dest >= pc && dest < focos.length) fi = dest;
      else if (dy < 0) fi = Math.max(0, pc - 1);
      pintar(); return;
    }
    if (dy > 0 && !enCards && pc >= 0) { fi = pc; pintar(); return; }
    var paso = dx !== 0 ? dx : dy, n = fi + paso;
    if (n >= 0 && n < focos.length) { fi = n; pintar(); }
  }
  function activar() {
    var el = focos[fi]; if (!el) return;
    if (el.id === 'nuevo') { try { el.focus(); } catch (e) {} return; }
    if (el.onclick) el.onclick(); else if (el.click) el.click();
  }
  document.addEventListener('keydown', function (e) {
    var k = e.keyCode || e.which;
    var escr = document.activeElement && document.activeElement.id === 'nuevo';
    if (escr && k !== 13 && k !== 27 && k !== 8 && k !== 461 && k !== 10009) return;
    if (k === 37) mover(-1, 0);
    else if (k === 39) mover(1, 0);
    else if (k === 38) mover(0, -1);
    else if (k === 40) mover(0, 1);
    else if (k === 13) { if (escr) { document.activeElement.blur(); $('bAgregar').onclick(); } else activar(); }
    else if (k === 8 || k === 27 || k === 461 || k === 10009) {
      if (escr) document.activeElement.blur();
      else if (enRepro()) $('bVolver').onclick();
      else { if (window.history && history.length > 1) history.back(); }
    } else return;
    if (e.preventDefault) e.preventDefault();
  }, false);

  mostrarCal();
  cargarLista();
  refresco = setInterval(cargarLista, 60000);
})();
</script>
</body>
</html>
